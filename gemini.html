<!DOCTYPE html>
<html>
<head>
  <title>Gemini Assistant</title>
  <style>
    body { font-family: Arial; max-width: 800px; margin: 50px auto; }
    textarea { width: 100%; height: 100px; }
    button { padding: 10px 20px; background: blue; color: white; border: none; cursor: pointer; }
    #reponse { margin-top: 20px; padding: 10px; background: #f0f0f0; border-radius: 5px; }
  </style>
</head>
<body>
  <h1>Gemini Code Assistant</h1>
  
  <textarea id="prompt" placeholder="Demande du code ici..."></textarea>
  <button onclick="generer()">Générer</button>
  
  <div id="reponse"></div>

  <script>
    const API_KEY = "ta-clé-api-ici";
    const API_URL = "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent";

    async function generer() {
      const prompt = document.getElementById("prompt").value;
      const reponseDiv = document.getElementById("reponse");
      
      reponseDiv.innerHTML = "En cours...";

      try {
        const response = await fetch(`${API_URL}?key=${API_KEY}`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            contents: [
              {
                parts: [
                  {
                    text: prompt,
                  },
                ],
              },
            ],
          }),
        });

        const data = await response.json();
        const texte = data.contents[0].parts[0].text;
        
        reponseDiv.innerHTML = `<pre>${texte}</pre>`;
      } catch (error) {
        reponseDiv.innerHTML = `Erreur: ${error.message}`;
      }
    }
  </script>
</body>
</html>
